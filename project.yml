    # the exactVersion approach RUNBOOK/SC1 describe). FABOLUS_TANDEM_LOCAL=1 swaps to the sibling
    # path for co-dev/offline/worktree builds (mirrors the existing NUDGE/GARMIN fenced blocks).
    # >>> TANDEM_LOCAL (generate-project.sh KEEPS this block ONLY when FABOLUS_TANDEM_LOCAL=1)
    path: ../TandemKit
    # <<< TANDEM_LOCAL
    # >>> TANDEM_PINNED (generate-project.sh strips this block when FABOLUS_TANDEM_LOCAL=1)
    url: https://github.com/faBolus-app/TandemKit.git
