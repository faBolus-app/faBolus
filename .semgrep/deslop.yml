# Local Semgrep rules that flag AI-agent process residue and vacuous tests.
#
# These are NOT security rules and NOT a quality score. Each hit is a candidate for human triage
# against one question: does the flagged text encode behavior or a safety reason, or is it only a
# record of which ticket touched the line? Safety rationale, fail-closed notes, hardware
# observations, and clamp/confirm rules are KEEP even when a rule below matches them.
#
# The path lists cover all three sibling repos (faBolus `ios/`, `Packages/faBolusCore`,
# `Packages/faBolusDesign`, `Shared/`; TandemKit `Sources/` + `Tests/`; faBolusGarmin `source/app`,
# `tests/`, `datafield/`) so one config can be pointed at any of them.
#
# TWO STRUCTURAL LIMITS, so a clean run is not mistaken for a clean tree:
#   1. Every comment rule is anchored to a comment prefix, so a ticket ID inside a STRING LITERAL is
#      invisible. There are ~82 such lines in faBolus. They are left alone on purpose: an `#expect` /
#      `Test.assertMessage` failure message is runtime text, and editing it forfeits the token-stream
#      proof that a deslop pass changed no behavior.
#   2. Following from that: where a runtime message names a tag, the COMMENT defining that tag is a
#      KEEP, or the test prints "(WR-02)" with nothing in the file defining it. Those are the
#      permanent residuals -- 8 in faBolus (CR-01/WR-01/WR-02/WR-03, C1-01), 4 in faBolusGarmin
#      (CX-G-09, CX-G-07). Do not "fix" them by stripping the comment.
#
# On faBolusGarmin, scan `.` and not `source`: `tests/` is in the globs, and the repo ships a
# `.semgrepignore` because semgrep's built-in default list silently drops a lowercase `tests/`.
#
# Run:  semgrep --config .semgrep/deslop.yml --metrics=off <repo>
rules:
  - id: phase-ticket-comment
    languages: [generic]
    severity: INFO
    message: >-
      Comment carries a phase/ticket breadcrumb (Phase N, Phase-N, NN-NN, NN.N-NN, D-NN, FEAT-NN,
      WR-NN, WR-AN, CX-x-NN, REMED-NN, LOCK-NN, T-NN-NN, GO-N, VA-NN, CR-NN, CC-NN, IN-NN, RN-NN,
      CN-NN, OQN).
      Delete the identifier; keep any surrounding "why".
      KNOWN RESIDUAL FALSE POSITIVE: a bare numeric range still matches, e.g. "runs 29-30+ chars"
      (a display-width budget) or "22-23" — those are measurements, not tickets. Check before deleting.
    paths:
      include:
        - "/ios/**/*.swift"
        - "/Packages/faBolusCore/**/*.swift"
        - "/Packages/faBolusDesign/**/*.swift"
        - "/Packages/*/Package.swift"
        - "/Shared/**/*.swift"
        - "/Sources/**/*.swift"
        - "/Tests/**/*.swift"
        - "/source/app/*.mc"
        - "/tests/*.mc"
        - "/datafield/*.mc"
      exclude:
        - "**/Vendor/**"
        - "**/vendor/**"
        - "**/ShareClient/**"
        - "**/G7SensorKit/**"
        - "**/DexcomG6Kit/**"
        - "**/HistoryStore/**"
        - "**/cliparser/**"
    # `(?<!bytes )` / `(?<!byte )` fence the wire-offset form ("carbs 13 g @ bytes 17-18"), which is
    # a field position, not a ticket — pervasive in TandemKit's oracle byte-locks. The `"` fences fence
    # a QUOTED `NN-NN`, which is a data value rather than a reference — Garmin's alert identities are
    # `kind-id` strings, so a comment reading `// "31-30" already seen` was matching.
    # The bare `NN-NN` alternative is fenced by lookaround so it does NOT match an ISO date
    # (`2026-08-23` — the `08-23` is preceded by `-`) or a source line range (`.java:72-74` — the
    # `72-74` is preceded by `:`; a comma-continued range like `ConnectIQ.h:53-58,64-68` needs the
    # comma in the class too, or the second half still matches). These were systematic false positives
    # that flagged exactly the
    # KEEP-class content this ruleset is supposed to protect: hardware-capture dates and oracle
    # citations. `NN.N-NN` is a separate alternative for this repo's `09.3-04` / `09.15-11` form,
    # which the old pattern never matched at all.
    pattern-regex: >-
      (?://|/\*|^\s*\*)[^\n]*\b(?:Phase[-\s]\d+(?:\.\d+)?|\d\d\.\d+-\d\d|(?<![\d:.,-])(?<!bytes )(?<!byte )(?<!")\d\d-\d\d(?!["\d-])|D\d?-\d\d|FEAT-\d\d|WR-(?:\d\d|A\d)|CX-[A-Z]-\d\d|REMED-\d+|LOCK-\d\d|T-\d\d-\d\d|GO-\d|VA-\d\d|CR-\d\d|CC-\d\d|IN-\d\d|[RC]\d-\d\d|OQ\d)\b

  - id: migration-breadcrumb-comment
    languages: [generic]
    severity: INFO
    message: >-
      Comment records a past code move or deletion ("moved verbatim", "was X, now deleted",
      "git rm'd", "carved out of"). That history lives in git, not in the source.
    paths:
      include:
        - "/ios/**/*.swift"
        - "/Packages/faBolusCore/**/*.swift"
        - "/Packages/faBolusDesign/**/*.swift"
        - "/Packages/*/Package.swift"
        - "/Shared/**/*.swift"
        - "/Sources/**/*.swift"
        - "/Tests/**/*.swift"
        - "/source/app/*.mc"
        - "/tests/*.mc"
        - "/datafield/*.mc"
      exclude:
        - "**/Vendor/**"
        - "**/vendor/**"
        - "**/ShareClient/**"
        - "**/G7SensorKit/**"
        - "**/DexcomG6Kit/**"
        - "**/HistoryStore/**"
        - "**/cliparser/**"
    # Two fixes over the naive pattern, both from real false positives in this tree:
    #  * `\bmoved` — without the word boundary, `moved from` matched inside "REmoved from", so
    #    "peer mode is removed from narrow main" read as a migration breadcrumb. 4 of 5 hits.
    #  * `carved (out )?of` is GONE. All four uses here mean "excluded from a gate" (AccessPolicyTests,
    #    ModeCoherenceTests, GatedPumpWrite, FeatureSurfaceAbsenceGuardTests) — a behavioral statement,
    #    never a code move. It was a 100% false-positive pattern in this codebase.
    pattern-regex: >-
      (?://|/\*|^\s*\*)[^\n]*(?:moved verbatim|\bmoved (?:from|out of)|was\s+\S+\.swift, now deleted|git rm'?d|extracted verbatim|lifted verbatim)

  - id: drifted-line-number-reference
    languages: [generic]
    severity: INFO
    message: >-
      Comment pins a file:line number. Line numbers drift silently and are never re-verified;
      name the symbol instead.
    paths:
      include:
        - "/ios/**/*.swift"
        - "/Packages/faBolusCore/**/*.swift"
        - "/Packages/faBolusDesign/**/*.swift"
        - "/Packages/*/Package.swift"
        - "/Shared/**/*.swift"
        - "/Sources/**/*.swift"
        - "/Tests/**/*.swift"
        - "/source/app/*.mc"
        - "/tests/*.mc"
        - "/datafield/*.mc"
      exclude:
        - "**/Vendor/**"
        - "**/vendor/**"
        - "**/ShareClient/**"
        - "**/G7SensorKit/**"
        - "**/DexcomG6Kit/**"
        - "**/HistoryStore/**"
        - "**/cliparser/**"
    pattern-regex: '(?://|/\*|^\s*\*)[^\n]*\b[A-Za-z][A-Za-z0-9+]*\.(?:swift|mc):\d+'

  - id: vacuous-expect-literal
    languages: [generic]
    severity: WARNING
    message: >-
      Assertion on a literal always passes (or always fails) regardless of product behavior.
      Pin real behavior or delete the test.
    paths:
      include:
        - "**/*Tests.swift"
    pattern-regex: '(?:#expect|#require|XCTAssert(?:True)?)\(\s*(?:true|false)\s*[,)]'

  - id: vacuous-empty-collection-loop
    languages: [generic]
    severity: WARNING
    message: >-
      Test declares an empty collection literal. If a later `for`/`forEach` iterates it, every
      assertion in the body is dead and the test passes vacuously. Verify the loop body still runs.
    paths:
      include:
        - "**/*Tests.swift"
    pattern-regex: 'let\s+\w+\s*:\s*(?:Set|Array)<[^>]+>\s*=\s*\[\s*\]'

  - id: working-tree-absence-scanner
    languages: [generic]
    severity: INFO
    message: >-
      Test asserts a path is absent from the working tree via #filePath. This pins a completed
      `git rm`, not product behavior — it cannot catch the feature returning through a different
      file. Keep only if it is the last line of defense for a dose-affecting surface; otherwise
      replace with a behavior assertion.
    paths:
      include:
        - "**/*Tests.swift"
    pattern-regex: 'fileExists\(atPath:[^)]*\)[\s\S]{0,200}?must (?:be absent|not exist)'

  - id: source-text-scanning-test
    languages: [generic]
    severity: INFO
    message: >-
      Test greps its own source tree (`source.contains(...)`) instead of exercising an API. Fragile
      to renames and defeatable by an equivalent spelling. Prefer a behavior assertion.
    paths:
      include:
        - "**/*Tests.swift"
    pattern-regex: '\bsource(?:Text)?\.contains\('

  - id: skipped-test
    languages: [generic]
    severity: WARNING
    message: A skipped test is not a passing test. Fix it, delete it, or record why it is gated.
    paths:
      include:
        - "**/*Tests.swift"
    pattern-regex: '\b(?:XCTSkip(?:If|Unless)?|withKnownIssue)\b'

  - id: agent-doc-header-mandate
    languages: [generic]
    severity: WARNING
    message: >-
      Agent-facing doc instructs future agents to maintain per-file header doc-comments or to add a
      Co-Authored-By trailer. Both rules generate process residue; remove them from the doc.
    paths:
      include:
        - "/AGENTS.md"
        - "llms.txt"
        - "CONTRIBUTING.md"
    pattern-regex: '(?i)(?:every file (?:opens|begins|starts) with|file[- ]header doc[- ]comment|keep (?:this|the header) current|Co-Authored-By)'
