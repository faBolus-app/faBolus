name: CI

on:
  push:
    branches: [main, experimental, 'dev/**']
  pull_request:
  # Manual re-validation. Required, not a convenience: this repo's CI fires only on ITS OWN pushes and
  # PRs, but TandemKit is a local package dependency — so when a sibling repo merges, nothing here
  # re-runs and `main` can be broken by a commit that is not in this repo. v3 §1.2's cross-repo
  # reconciliation step depends on being able to re-run a repo after a sibling moves.
  workflow_dispatch:

jobs:
  # Branch-aware cross-repo resolution (v3 §1.2). TandemKit is a local package dependency, so the three
  # build jobs below must check it out at the branch that MATCHES the faBolus branch under test —
  # `experimental` faBolus builds against `experimental` TandemKit — falling back to `main` when no
  # same-named counterpart exists. `actions/checkout` has no fallback of its own, and the dangerous
  # failure is a silent one: a build that looks green only because the checkout quietly took `main`
  # when a match was intended. So the decision is made ONCE here, logged with the resolved ref AND its
  # SHA, and consumed by the build jobs via an output — one auditable line instead of three copies that
  # could drift.
  #
  # TandemKit version-pin interaction (Phase 03, D-04): faBolus now defaults to consuming TandemKit via
  # a `url:`+`revision:` pin in project.yml (D-01), not this branch-matched checkout. Under that
  # default, SwiftPM fetches TandemKit straight from GitHub at the pinned revision and IGNORES the
  # `repos/TandemKit` checkout below entirely — so `resolve-refs` + the "Checkout TandemKit" steps would
  # go inert for dependency resolution, and a green run would silently stop validating an experimental
  # faBolus against an experimental TandemKit (RESEARCH Pitfall 3 — the §1.2 branch-aware promise
  # breaking silently is exactly the T-03-02 threat in 03-03-PLAN.md's threat model).
  #
  # Chosen posture — OPTION A (preserve the branch-aware promise, documented tradeoff):
  #   Option A: keep the three build jobs on `FABOLUS_TANDEM_LOCAL=1` so they still consume this
  #     branch-matched checkout (status quo cross-repo validation preserved), and add a SEPARATE job
  #     (`tandemkit-pin-resolves` below) that generates WITHOUT the override — i.e. the real default a
  #     clone/release build gets — and resolves the pinned graph, to prove the pin itself is healthy.
  #     Tradeoff: CI's three build jobs no longer exercise the exact default dependency path a plain
  #     `git clone && ./scripts/generate-project.sh` gets; that gap is covered by the pin-resolves job.
  #   Option B (NOT chosen): let the pin win by default in CI too (drop FABOLUS_TANDEM_LOCAL=1 from the
  #     build jobs) — CI would then match a fresh clone exactly, but the branch-aware cross-repo
  #     validation this whole `resolve-refs` job exists for would go dark on every faBolus-only push,
  #     silently narrowing coverage exactly as T-03-02 describes.
  # Option A was picked because the branch-aware promise is an explicit, named contract in BRANCHES.md
  # §1.3 ("Cross-repo CI is branch-aware") that predates this pin — narrowing it silently would be worse
  # than the (documented, monitored) gap Option A leaves. See 03-03-PLAN.md / 03-03-SUMMARY.md.
  resolve-refs:
    name: Resolve cross-repo refs
    runs-on: ubuntu-latest
    outputs:
      tandemkit_ref: ${{ steps.resolve.outputs.tandemkit_ref }}
    steps:
      - name: Resolve TandemKit ref (match faBolus branch, else main)
        id: resolve
        run: |
          set -euo pipefail
          WANT="${{ github.head_ref || github.ref_name }}"
          REPO="https://github.com/faBolus-app/TandemKit.git"
          if [ -n "$WANT" ] && git ls-remote --exit-code --heads "$REPO" "$WANT" >/dev/null 2>&1; then
            REF="$WANT"; HOW="matched the faBolus branch '$WANT'"
          else
            REF="main"; HOW="fell back to main (no TandemKit branch named '${WANT:-<none>}')"
          fi
          SHA="$(git ls-remote "$REPO" "refs/heads/$REF" | cut -f1)"
          echo "tandemkit_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "TandemKit → $REF @ $SHA  ($HOW)"
          echo "::notice title=TandemKit checkout::$REF @ ${SHA:0:12} — $HOW"

  core:
    name: Package tests + contract drift
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The Swift RemoteCommand mirror must not drift from schema/command.schema.json.
      - name: Contract drift check
        run: ./scripts/check-schema-drift.sh

      # Provenance chain (audit L-01): every vendored/local package must carry a LICENSE + an SBOM row.
      - name: SBOM / license provenance check
        run: ./scripts/check-sbom.sh

      # The stable contracts + models have no pump/UI dependencies, so they test fast on macOS.
      - name: faBolusCore unit tests
        run: swift test --package-path Packages/faBolusCore

      # Three suites that EXISTED but were never invoked by CI: HistoryStore (the persistence layer
      # the settings-change log and bolus history sit on) and the two vendored CGM decoders. All three
      # are pure-logic packages with no pump or UI dependency, so there was no reason for them to be
      # unrun — they were simply missed. ShareClient has no test target; nothing to add there.
      - name: HistoryStore unit tests
        run: swift test --package-path Packages/HistoryStore

      - name: G7SensorKit unit tests
        run: swift test --package-path Packages/G7SensorKit

      - name: DexcomG6Kit unit tests
        run: swift test --package-path Packages/DexcomG6Kit

  ios-build:
    name: iOS app build (TandemBackend / AppModel / widgets)
    runs-on: macos-15
    needs: resolve-refs
    steps:
      # Two-level checkout so the project's relative package paths resolve (see watch-build).
      - name: Checkout faBolus
        uses: actions/checkout@v4
        with:
          path: repos/faBolus

      - name: Checkout TandemKit (local package dependency, branch-aware — see resolve-refs)
        uses: actions/checkout@v4
        with:
          repository: faBolus-app/TandemKit
          ref: ${{ needs.resolve-refs.outputs.tandemkit_ref }}
          submodules: recursive
          path: repos/TandemKit

      - name: Install XcodeGen
        run: brew install xcodegen

      # Generate with the credential-gated pieces stripped (no private Nudge SDK, no Garmin SDK), then
      # build the full iOS app for the Simulator. This is the audit-T-01 gap: the iOS app — TandemBackend
      # (signed bolus flow, transaction serialization), AppModel.remoteDeliver, the widget receiver, and
      # the pairing hosts — was never compiled in CI before, only faBolusCore + the watch.
      # NOTE — GarminRemoteBridge.swift is NOT compiled here, and that is a recorded decision, not an
      # oversight. It sits behind `#if GARMIN` and imports Garmin's ConnectIQ binary xcframework, which
      # is license-gated and uncommitted, so `FABOLUS_GARMIN=0` (required in CI) strips it. This is the
      # same license wall as the shipping Garmin jungles in faBolusGarmin. A hand-written ConnectIQ stub
      # would compile in CI but would drift from the real SDK and give false confidence — worse than an
      # honest gap. The bridge's build gate is therefore LOCAL: `./scripts/build-sim.sh` auto-detects the
      # SDK and compiles it (verified 2026-08-04 with FABOLUS_GARMIN=1 — BUILD SUCCEEDED). Extracting the
      # pure message→RemoteCommand mapping into an SDK-free, CI-testable unit is the right long-term fix;
      # it is deferred because it touches the Garmin safety path that master-plan P11/P12 rewrite.
      - name: Generate the Xcode project (no private SDK, no Garmin)
        working-directory: repos/faBolus
        run: FABOLUS_TANDEM_LOCAL=1 FABOLUS_NUDGE=0 FABOLUS_GARMIN=0 ./scripts/generate-project.sh

      # Align CI to the toolchain the team develops/ships on (Xcode 26.x / Swift 6.2). The runner's
      # default was Xcode 16.4 (Swift 6.1), whose region-isolation ("sending") checker has known
      # false-positives that 6.2 relaxed — a source of local-green/CI-red divergence. Self-adjusting:
      # picks the newest installed Xcode and prints the inventory so a missing 26.x is visible.
      - name: Select newest available Xcode (align to dev toolchain — Swift 6.2)
        run: |
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app 2>/dev/null || true
          NEWEST="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST/Contents/Developer"; fi
          echo "Selected Xcode:"; xcodebuild -version

      - name: Build iOS app (Simulator, signing off)
        working-directory: repos/faBolus
        run: |
          set -o pipefail
          xcodebuild -project faBolus.xcodeproj -scheme faBolus \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build

      # Audit C-08: behavioral e2e for the remote-delivery decision logic — divergence guard,
      # freeze-before-approve (C-02), child/read-only action gates (A-05), idempotency wiring
      # (A-02) — running the real AppModel against MockBackend on a booted Simulator. A concrete
      # destination (not `generic/…`) is required to actually run the tests.
      # Call the script rather than reimplementing it. The inlined copy this replaces picked its
      # simulator with `grep -Eo 'iPhone [0-9]+'`, which cannot match "iPhone 17 Pro" — the device
      # family current Xcodes actually install — so it silently fell back to a hardcoded "iPhone 16"
      # that may not exist on the runner. scripts/test-ios.sh already solved this; two copies of a
      # destination-selection rule is one copy too many.
      # Snapshot suites are pixel-golden tests recorded against a specific Xcode/simulator, so they
      # are environment-brittle across toolchains — the 16.x-recorded baselines fail on the 26.x
      # runner even for views nobody changed (e.g. SettingsSnapshotTests). They never gated CI
      # historically (the iOS build failed before tests ever ran). Per owner decision (2026-08-19)
      # they are NON-GATING in CI: still run locally for visual-regression, skipped here. To make
      # them CI-gating later, re-record baselines in the CI toolchain + add a perceptualPrecision
      # tolerance (tracked follow-up).
      - name: Run app behavioral tests (Simulator)
        working-directory: repos/faBolus
        run: |
          FABOLUS_NUDGE=0 FABOLUS_GARMIN=0 ./scripts/test-ios.sh \
            -skip-testing:faBolusAppTests/BolusEntrySnapshotTests \
            -skip-testing:faBolusAppTests/PumpControlSnapshotTests \
            -skip-testing:faBolusAppTests/SettingsSnapshotTests \
            -skip-testing:faBolusAppTests/DashboardSnapshotTests

  watch-build:
    name: watchOS app + complication build
    runs-on: macos-15
    needs: resolve-refs
    steps:
      # Two-level checkout so the project's relative package paths resolve:
      #   repos/faBolus/../TandemKit  and  repos/faBolus/../../vendor/<ConnectIQ>
      - name: Checkout faBolus
        uses: actions/checkout@v4
        with:
          path: repos/faBolus

      - name: Checkout TandemKit (local package dependency, branch-aware — see resolve-refs)
        uses: actions/checkout@v4
        with:
          repository: faBolus-app/TandemKit
          ref: ${{ needs.resolve-refs.outputs.tandemkit_ref }}
          submodules: recursive
          path: repos/TandemKit

      - name: Install XcodeGen
        run: brew install xcodegen

      # Generate via the project script with the optional, credential-gated pieces stripped: the private
      # faBolusNudge SDK (CI can't clone it) and Garmin's ConnectIQ SDK (not committed — license). This is
      # the same open-source build path an external contributor without those gets; the watch app links
      # neither, so the WatchCI scheme builds cleanly. See scripts/generate-project.sh.
      - name: Generate the Xcode project (no private SDK, no Garmin)
        working-directory: repos/faBolus
        run: FABOLUS_TANDEM_LOCAL=1 FABOLUS_NUDGE=0 FABOLUS_GARMIN=0 ./scripts/generate-project.sh

      # Builds the watchOS app + glucose complication (and their SPM deps) via the WatchCI scheme,
      # which excludes the iOS app so ConnectIQ isn't needed. Catches watchOS build breakage.
      - name: Build watch app + complication
        working-directory: repos/faBolus
        run: |
          set -o pipefail
          xcodebuild -project faBolus.xcodeproj -scheme WatchCI \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build

  mac-build:
    name: macOS remote app + widgets build
    runs-on: macos-15
    needs: resolve-refs
    steps:
      # Same two-level checkout as the iOS/watch jobs so relative package paths resolve.
      - name: Checkout faBolus
        uses: actions/checkout@v4
        with:
          path: repos/faBolus

      - name: Checkout TandemKit (local package dependency, branch-aware — see resolve-refs)
        uses: actions/checkout@v4
        with:
          repository: faBolus-app/TandemKit
          ref: ${{ needs.resolve-refs.outputs.tandemkit_ref }}
          submodules: recursive
          path: repos/TandemKit

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project (no private SDK, no Garmin)
        working-directory: repos/faBolus
        run: FABOLUS_TANDEM_LOCAL=1 FABOLUS_NUDGE=0 FABOLUS_GARMIN=0 ./scripts/generate-project.sh

      # §1.5 asks whether macOS is `main`-ready. It could not be answered while the macOS remote app
      # and its widgets were built by no CI job at all. The faBolusMac scheme embeds faBolusMacWidgets,
      # so this one build covers both. The Mac app is a BLE remote for the phone host — it never links
      # TandemKit or ConnectIQ, so the same no-SDK generation path works.
      - name: Build macOS remote app + widgets
        working-directory: repos/faBolus
        run: |
          set -o pipefail
          xcodebuild -project faBolus.xcodeproj -scheme faBolusMac \
            -destination 'generic/platform=macOS' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build

  # Proves the DEFAULT dependency path — the exact one a fresh `git clone && ./scripts/generate-
  # project.sh` gets, with no override — resolves cleanly. See the Option A / D-04 comment on
  # `resolve-refs` above: the three build jobs above deliberately keep FABOLUS_TANDEM_LOCAL=1 so they
  # still exercise branch-aware cross-repo CI, which means none of them alone proves the pinned
  # `url:`+`revision:` graph (project.yml, Package.resolved) actually resolves. This job is that proof,
  # isolated from the build jobs so a pin-resolution regression doesn't get masked by (or confused with)
  # a branch-aware build failure, and vice versa.
  tandemkit-pin-resolves:
    name: TandemKit pinned revision resolves (no FABOLUS_TANDEM_LOCAL override)
    runs-on: macos-15
    steps:
      - name: Checkout faBolus
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # No FABOLUS_TANDEM_LOCAL — this is the real default: TandemKit resolved from
      # `https://github.com/faBolus-app/TandemKit.git` at the pinned revision in project.yml, not the
      # branch-matched sibling checkout the other three build jobs use.
      - name: Generate the Xcode project (default pinned TandemKit, no private SDK, no Garmin)
        run: FABOLUS_NUDGE=0 FABOLUS_GARMIN=0 ./scripts/generate-project.sh

      - name: Resolve the pinned TandemKit dependency graph
        run: |
          set -o pipefail
          xcodebuild -project faBolus.xcodeproj -scheme faBolus \
            -resolvePackageDependencies
