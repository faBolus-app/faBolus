name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:
  workflow_dispatch:

# Every job is a gate except "report". The gates live in scripts/check.sh, so a local run and CI
# always agree.
jobs:
  swift:
    name: Build and test (Xcode 27.2)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app && xcodebuild -version
      - name: Build (warnings are errors)
        run: ./scripts/check.sh build
      - name: Test
        run: ./scripts/check.sh test

  app:
    name: App build and snapshot tests (Xcode 27.2)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app && xcodebuild -version
      # The generated project follows XcodeGen's version, so a different one fails here rather than
      # changing the build or the snapshots unseen. Bump it together with the snapshots.
      - name: Install XcodeGen 2.46.0
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version | grep -qx 'Version: 2.46.0'
      - name: App (no Connect IQ SDK here, so Garmin is off)
        run: ./scripts/check.sh app

  swift-lint:
    name: swift-format and SwiftLint
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app && xcrun swift-format --version
      - name: Install SwiftLint
        run: brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
      - run: ./scripts/check.sh format swiftlint

  lint:
    name: ShellCheck, actionlint, markdownlint, contract, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint and markdownlint-cli2
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          sudo mv actionlint /usr/local/bin/
          npm install --global markdownlint-cli2@0.24.0
      - run: ./scripts/check.sh shell actions markdown contract

  report:
    name: Semgrep and Periphery (report only)
    runs-on: xcode-27
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Install Semgrep and Periphery
        run: |
          pipx install semgrep
          brew list periphery >/dev/null 2>&1 || brew install periphery
      - name: Semgrep (residue rules)
        run: semgrep --config .semgrep/deslop.yml --metrics=off --exclude legacy .
      - name: Periphery (unused code, faBolusCore)
        working-directory: Packages/faBolusCore
        run: periphery scan --retain-public
