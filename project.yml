name: faBolus
options:
  bundleIdPrefix: com.fabolus
  createIntermediateGroups: true
  # P16 F6 (N13) — localization SEED. Pin the development language to English so
  # developmentRegion=en and knownRegions=(Base, en) stay stable across regeneration. This is
  # deliberately EN-ONLY: no second language is added (adding one incurs translation ownership).
  # The mechanism is the String Catalog `ios/faBolus/Localizable.xcstrings` — XcodeGen auto-includes
  # it as a resource of the `faBolus` app target because it lives under that target's source dir
  # (`ios/faBolus`), so Xcode's build system compiles it into the app's .lproj tables. The seeded
  # slice is the P14 mode/Objectives copy (see ios/faBolus/Views/ModeCopy.swift + ModeViews.swift).
  # Follow-up (deferred): faBolusCore-package strings (e.g. AppMode.title) need Package.swift
  # defaultLocalization + Bundle.module and are intentionally left English for now.
  developmentLanguage: en

# Build configuration is read from Config.xcconfig, which pulls in your personal,
# gitignored LocalConfig.xcconfig (copy it from LocalConfig.xcconfig.example).
# That's where APP_BUNDLE_ID and DEVELOPMENT_TEAM live — every identifier below is
# derived from $(APP_BUNDLE_ID), so setting your own is a one-line change.
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

packages:
  faBolusCore:
    # Stable, pump/host-agnostic contracts + models (in-repo local package).
    path: Packages/faBolusCore
  faBolusDesign:
    # Shared presentation layer: §13 glucose-band color tokens + the icon+word band-encoding
    # primitive (in-repo local package). Depends on faBolusCore for the single classifier/thresholds
    # (D-01/D-02) — no cycle, since faBolusCore has zero package dependencies of its own.
    path: Packages/faBolusDesign
  # >>> CGM_G7_KIT (scripts/generate-project.sh strips this package when FABOLUS_CGM_G7=0; default 0 = absent — Phase 1)
  G7SensorKit:
    # Dexcom G7/ONE+ BLE message decoders, vendored from LoopKit/G7SensorKit (MIT), LoopKit-free.
    path: Packages/G7SensorKit
  # <<< CGM_G7_KIT
  # >>> CGM_G6_KIT (scripts/generate-project.sh strips this package when FABOLUS_CGM_G6=0; default 1 = present)
  DexcomG6Kit:
    # Dexcom G5/G6/ONE passive glucose-message decoders, vendored from LoopKit/CGMBLEKit (MIT).
    path: Packages/DexcomG6Kit
  # <<< CGM_G6_KIT
  HistoryStore:
    # faBolus-owned persistent glucose/insulin/carb history (SwiftData) — powers TIR/plotting and
    # feeds the advisory tools. In-repo local package. See MIGRATION.md.
    path: Packages/HistoryStore
  ShareClient:
    # Dexcom Share follower core, vendored from LoopKit/dexcom-share-client-swift (MIT) — the
    # validated client Loop uses. Powers DexcomShareSource. See Phase 6 in MIGRATION.md.
    path: Packages/ShareClient
  SnapshotTesting:
    # Phase 09.17-01 (D-06b): pointfreeco/swift-snapshot-testing — the compact-width iPhone visual-
    # regression net for the iPad-adaptive retrofit (RESEARCH Package Legitimacy Audit: OK). Linked
    # into faBolusAppTests ONLY (see that target's dependencies: below) — never a shipping target.
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.19.4"
  # >>> NUDGE (scripts/generate-project.sh strips this block when the faBolusNudge repo is unavailable)
  faBolusNudge:
    # Advisory SDK (reusable, stateless): on-device eating detection + meal-detection intelligence.
    # Xcode auto-resolves this remote package on build. (Retrospective insights are no longer here —
    # they moved to faBolusCore and build unconditionally.) See MIGRATION.md.
    url: https://github.com/faBolus-app/faBolusNudge.git
    revision: c3d1e2284249e1667c8c17f37eeecb28c605d4a5
  # <<< NUDGE
  TandemKit:
    # Backend pump-protocol stack (Repo 1). §1.3 version-pin (revision form, D-01 owner override of
    # the exactVersion approach RUNBOOK/SC1 describe). FABOLUS_TANDEM_LOCAL=1 swaps to the sibling
    # path for co-dev/offline/worktree builds (mirrors the existing NUDGE/GARMIN fenced blocks).
    # >>> TANDEM_LOCAL (generate-project.sh KEEPS this block ONLY when FABOLUS_TANDEM_LOCAL=1)
    path: ../TandemKit
    # <<< TANDEM_LOCAL
    # >>> TANDEM_PINNED (generate-project.sh strips this block when FABOLUS_TANDEM_LOCAL=1)
    url: https://github.com/faBolus-app/TandemKit.git
    # origin/main tip at pin time (2026-08-13, PR #16, CI green): carries D3 (crypto .unsafeFlags →
    # .define, the version-pin prerequisite) squash-cherry-picked in the same commit as D2
    # (experimental BLE txId correlation, opt-in/fail-closed, unused by faBolus) — an accepted §1.4
    # deviation, owner-confirmed 2026-08-13 (pin-current-main), reconciled in 03-03/BRANCHES.md.
    # Repo renamed PumpX2Kit -> TandemKit 2026-08-15 (Phase 09.12-01); Phase 09.12-01's package-name
    # rename kept the SAME revision (byte-identical, resolved via GitHub's rename redirect). This
    # pin was advanced by Phase 09.12-02's product/target rename (PumpX2Messages/Auth/BLE ->
    # TandemMessages/Auth/BLE), which changed the products faBolus requests by name — a
    # revision bump was REQUIRED here (not optional), since the old pinned commit's Package.swift
    # still declares the pre-rename product names.
    # Pin BUMP 2026-08-20 (owner decision, debug session pump-background-disconnect): advanced from
    # 1a09dba -> TandemKit `main` @ 89c208e to land the H1 background-reconnect fix (PR #22). This bump is
    # NOT dose-path byte-identical vs 1a09dba — it also integrates the intervening merged PRs #17–21 (JPAKE
    # round-4 constant-time compare, 09.21 codec hardening, bolus-request device/API send-gating), which
    # changed signed files. Owner chose "bump to kit main + H1" and to re-verify #17–21 under Phase-11
    # discipline. STILL bench-pending: NO-GO for real insulin until the v0.4.0 Phase-11 saline bench
    # validates the dose-path changes this SHA now carries. See .planning/OWNER-DECISIONS.md + the debug session.
    revision: 89c208e12474ee97470a111c6d818426773866b8
    # <<< TANDEM_PINNED
  # >>> GARMIN (scripts/generate-project.sh strips this block when the SDK is absent)
  ConnectIQ:
    # Garmin Connect IQ Mobile SDK for iOS (binary xcframework). Not committed (Garmin
    # license). Place it where the docs describe. Path is relative to this repo.
    path: ../../vendor/connectiq-companion-app-sdk-ios-1.8.0
  # <<< GARMIN

targets:
  # iOS host app — owns the pump connection (TandemKit) and the main HUD.
  faBolus:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ios/faBolus
        # >>> APP_SOURCE_EXCLUDES (Phase-0 per-surface compile gates — D-03/TOPO-03. These sources live INSIDE
        #   the unconditional ios/faBolus include, so they are gated via this excludes: list rather than a
        #   whole-block strip. generate-project.sh removes this ENTIRE block when every gate below is at its
        #   default (=1, surface PRESENT) so the app target is byte-identical to today's shipped build; when any
        #   FABOLUS_* gate is set to 0 the block is KEPT and only the still-present (=1) surfaces' exclude lines
        #   are dropped, leaving the =0 surface excluded. Phase 0 AUTHORS these gates and flips NOTHING off — the
        #   removal flip is the owning per-surface phase's job (CGM → Phase 1).)
        excludes:
          # >>> CGM_NIGHTSCOUT (kept only when FABOLUS_CGM_NIGHTSCOUT=0 → excludes the Nightscout source + backfill; stripped by default)
          - Data/Sources/NightscoutSource.swift
          - Data/Sources/NightscoutBackfill.swift
          # <<< CGM_NIGHTSCOUT
          # Phase 3 (03-02, REMOTE-02): the PHONE_PEER gate is retired — the iPhone-to-iPhone peer remote
          # is now physically git rm'd from main (delete-on-main, D-01), preserved on dev/phone-remote,
          # not a compile-gated exclude. PeerRemoteHost.swift/PhoneRemoteClientModel.swift/
          # RemotePeerPolicyStore.swift (now a minimal stub)/RemoteControlView.swift/RemoteRootView.swift/
          # RemoteSettingsView.swift no longer exist on main at all.
          # >>> FOODFINDER (kept only when FABOLUS_FOODFINDER=0 → excludes exactly the 3 FoodFinder source dirs;
          #   stripped by default. The foodFinderAIEnabled runtime flag gates the AI sub-path separately and is
          #   unaffected. First nested-directory excludes: shape in this repo — validated by real xcodegen generate.)
          - Data/FoodFinder
          - Views/FoodFinder
          - Vendor/LoopPowerPack/FoodFinder
          # <<< FOODFINDER
        # <<< APP_SOURCE_EXCLUDES
      # PhoneRemoteHost.swift (the shared Garmin/widget-adjacent WatchConnectivity receiver core,
      # REMOTE-02) is already covered by the unconditional `ios/faBolus` include above — the
      # PHONE_PEER_KEEP redundant-retention block (Phase 0) is retired now that PHONE_PEER itself is
      # retired (Phase 3, 03-02): there is no longer a strip that could ever drop this file.
      # WidgetBolusIntents belongs to the widget extensions only (the app uses WidgetBolusReceiver).
      - path: Shared
        excludes:
          - WidgetBolusIntents.swift
    dependencies:
      - package: faBolusCore
        product: faBolusCore
      - package: faBolusDesign
        product: faBolusDesign
      # >>> CGM_G7_KIT (scripts/generate-project.sh strips this dependency when FABOLUS_CGM_G7=0; default 0 = absent — Phase 1)
      - package: G7SensorKit
        product: G7SensorKit
      # <<< CGM_G7_KIT
      # >>> CGM_G6_KIT (scripts/generate-project.sh strips this dependency when FABOLUS_CGM_G6=0; default 1 = present)
      - package: DexcomG6Kit
        product: DexcomG6Kit
      # <<< CGM_G6_KIT
      - package: HistoryStore
        product: HistoryStore
      - package: ShareClient
        product: ShareClient
      # >>> NUDGE (stripped by scripts/generate-project.sh when the faBolusNudge repo is unavailable)
      - package: faBolusNudge
        product: GlucoseIntelligenceKit
      - package: faBolusNudge
        product: AlertIntelligenceKit
      - package: faBolusNudge
        product: EatingDetectionKit
      - package: faBolusNudge
        product: ModelCatalogKit
      # <<< NUDGE
      - package: TandemKit
        product: TandemMessages
      - package: TandemKit
        product: TandemAuth
      - package: TandemKit
        product: TandemBLE
      # >>> GARMIN (stripped by scripts/generate-project.sh when the SDK is absent)
      - package: ConnectIQ
        product: ConnectIQ
      # <<< GARMIN
      # Embeds the WidgetKit extension (Lock Screen + Home Screen widgets).
      - target: faBolusWidgets
      # Phase 3 (03-03, REMOTE-03): the watchOS companion app embed + its FABOLUS_WATCH/
      # WATCH_EMBEDDED gate are retired — the whole Watch app + complication tree is git rm'd
      # from main (delete-on-main, D-01), preserved on dev/watch-remote. Not a compile-gated
      # embed anymore; there is nothing to embed.
    entitlements:
      path: ios/faBolus/faBolus.entitlements
      properties:
        # Shared container the app writes and the widgets read.
        com.apple.security.application-groups:
          - group.$(APP_BUNDLE_ID)
          # To read xDrip4iOS via its "Share to Loop" App Group, build + sign xDrip under the SAME
          # Apple Developer Team ID and uncomment the group matching xDrip's share type (App Groups
          # are team-scoped). $(DEVELOPMENT_TEAM) is substituted with your signing team at build.
          # See docs/operate/cgm-failover.md.
          # - group.com.$(DEVELOPMENT_TEAM).loopkit.LoopGroup                 # xDrip share type: Loop
          # - group.org.nightscout.$(DEVELOPMENT_TEAM).trio.trio-app-group   # xDrip share type: Trio
        # F1 (§13): default at-rest data protection for files this app creates that can't take a per-file
        # class (App-Group UserDefaults telemetry/runtime plists, the SwiftData history store).
        # "AfterFirstUnlock" — encrypted at rest yet readable during a locked background relaunch, matching
        # the delivery ledger. NEVER "…Complete": that would lock the ledger/history when the device locks
        # and break crash-recovery/reconciliation of an in-flight delivery. This is also iOS's own default
        # class, and inert on the unsigned Simulator (CI) build. It DOES require the Data Protection
        # capability provisioned on the App ID to SIGN a device build, so scripts/generate-project.sh
        # strips the tagged line below by default (like HealthKit/iCloud) — set FABOLUS_DATA_PROTECTION=1
        # on a provisioned/paid account to keep it. Stripping is a no-op on-device (this is iOS's default).
        # >>> DATA_PROTECTION (stripped by scripts/generate-project.sh unless FABOLUS_DATA_PROTECTION=1)
        com.apple.developer.default-data-protection: NSFileProtectionCompleteUntilFirstUserAuthentication
        # <<< DATA_PROTECTION
        # >>> TIME_SENSITIVE (stripped by scripts/generate-project.sh unless FABOLUS_TIME_SENSITIVE=1)
        # CR-01 (Phase 08): Time-Sensitive Notifications so the never-suppressible safety trio (pump
        # disconnected / CGM data lost / unresolved bolus) breaks through Focus / Do Not Disturb via
        # UNNotificationInterruptionLevel.timeSensitive while the special-request Critical Alerts entitlement
        # (D-02, deliberately absent) is still pending — what NotificationPoster.post now sets and what
        # AlertRulesView's "time-sensitive delivery" copy promises. Like Data Protection it needs the
        # capability provisioned on the App ID to SIGN a device build, so it is stripped by default so an
        # unmodified clone signs on a free account; enable on a provisioned account with FABOLUS_TIME_SENSITIVE=1.
        com.apple.developer.usernotifications.time-sensitive: true
        # <<< TIME_SENSITIVE
        # HealthKit (Phase 09.23, D-10/D-13): the Apple Health CGM source (xDrip4iOS in real time, or
        # Eversense) + on-demand HR reader, PLUS the retrospective carbs/insulin import and the bolus
        # export, all need the paid Apple Developer Program to enable this capability, so it's off by
        # default and the app builds/signs on a free account. scripts/generate-project.sh strips the
        # tagged block below (and the FABOLUS_HEALTHKIT compile flag) unless FABOLUS_HEALTHKIT=1. See
        # docs/operate/cgm-failover.md.
        # >>> HEALTHKIT (stripped by scripts/generate-project.sh unless FABOLUS_HEALTHKIT=1)
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # <<< HEALTHKIT
        # Automatic iCloud backup of app settings (Backup & restore) is OPT-IN for the same reason:
        # iCloud needs the paid Apple Developer Program. Default OFF: scripts/generate-project.sh strips
        # the block below AND the FABOLUS_ICLOUD compile flag unless FABOLUS_ICLOUD=1, so an unmodified
        # clone signs and builds on a free account with the no-op stub. The file-based backup/restore
        # needs no entitlement and always works. Set FABOLUS_ICLOUD=1 (paid account) to compile it in.
        # >>> ICLOUD (stripped by scripts/generate-project.sh unless FABOLUS_ICLOUD=1)
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(APP_BUNDLE_ID)
        # <<< ICLOUD
    info:
      path: ios/faBolus/Info.plist
      properties:
        # App Group id (group.$(APP_BUNDLE_ID)) exposed to code so the shared-container store derives
        # it at runtime instead of hardcoding — stays correct if a self-compiler overrides APP_BUNDLE_ID.
        AppGroupIdentifier: group.$(APP_BUNDLE_ID)
        # Garmin Connect builds its "select devices for <app>" screen from CFBundleDisplayName.
        CFBundleDisplayName: faBolus
        # The Connect IQ BETA app id the phone pairs with (dashed UUID). Self-compilers who build their
        # own private beta set GARMIN_BETA_APP_ID in LocalConfig.xcconfig (see faBolusGarmin/scripts/
        # beta-build.sh). Defaults to the shared beta id via Config.xcconfig.
        GarminBetaAppID: $(GARMIN_BETA_APP_ID)
        # How Siri should pronounce/recognize the app name in App Shortcut phrases ("… in <name>").
        CFBundleSpokenName: "Fabolus"
        # iOS allows at most 3 alternative names.
        INAlternativeAppNames:
          - INAlternativeAppNameKey: "faBolus"
          - INAlternativeAppNameKey: "Pump Remote"
          - INAlternativeAppNameKey: "Fabolus"
        NSBluetoothAlwaysUsageDescription: "faBolus connects to your pump over Bluetooth to read status and deliver boluses."
        # Scan a host phone's pairing QR code when using this phone as a remote, AND scan food barcodes
        # in FoodFinder for a carb estimate the user reviews (09.18c-02, D-13) — never a dose.
        NSCameraUsageDescription: "faBolus uses the camera to scan a pairing QR code when connecting to another phone as a remote, and to scan food barcodes for a carb estimate you review — it never doses for you."
        # Optional eating-nudge location gate: learn the coarse places you eat, on-device, to skip nudges
        # elsewhere. Off by default; uses significant-location changes only. See EatingLocationGate.
        NSLocationWhenInUseUsageDescription: "faBolus can learn the places you usually eat (on your device only) so it can skip eating reminders when you're clearly somewhere else. Optional and off by default."
        # Read glucose from Apple Health as a failover CGM feed (xDrip4iOS in real time, or Eversense).
        # 09.18b (D-07): also read heart rate on demand as OPTIONAL chart context for the glucose detail
        # readout (never a dosing/meal input) — additive to the glucose read, never gating it.
        NSHealthShareUsageDescription: "faBolus can read glucose from Apple Health as a backup CGM feed (e.g. from xDrip4iOS or Eversense) when the pump's glucose is unavailable. faBolus may also read your heart rate to show it as optional chart context in the glucose detail readout — heart rate is never used for dosing."
        # Phase 09.23 (D-10/D-13): write-out usage string for the bolus/carbs/insulin export feature,
        # stripped in lockstep with the entitlement block above (same FABOLUS_HEALTHKIT tag, a second
        # tagged block — strip_block handles multiple blocks per tag, same as DATA_PROTECTION's two).
        # >>> HEALTHKIT (stripped by scripts/generate-project.sh unless FABOLUS_HEALTHKIT=1)
        NSHealthUpdateUsageDescription: "faBolus can write your carb, insulin, and glucose entries to Apple Health so other apps and your clinic can see them. You choose which types to export."
        # <<< HEALTHKIT
        # Keep the pump BLE connection alive in the background (bluetooth-central), and act as a BLE
        # peripheral for the Mac remote (bluetooth-peripheral) so it works when locked/backgrounded.
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
        UILaunchScreen: {}
        # Phase 5 (D-04) — the ONLY addition this Live Activity needs: app-driven Activity.update()
        # off the existing bluetooth-central background mode above. NO aps-environment entitlement,
        # NO push; entitlements stay App-Groups-only.
        NSSupportsLiveActivities: true
        # Garmin Connect IQ companion messaging: our custom callback scheme + querying the
        # Garmin Connect Mobile app.
        LSApplicationQueriesSchemes: [gcm-ciq]
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID).ciq
            CFBundleURLSchemes: [fabolusciq]
          # Deep links from the widgets (fabolus://bolus, fabolus://open).
          - CFBundleURLName: $(APP_BUNDLE_ID).deeplink
            CFBundleURLSchemes: [fabolus]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Feature compile flags. Default enables Garmin (ConnectIQ);
      # scripts/generate-project.sh removes the GARMIN token (and the package above) when the Garmin
      # SDK is absent. WATCH_EMBEDDED is permanently retired (Phase 3, 03-03, REMOTE-03) — the whole
      # Watch app + complication tree is git rm'd from main, so there is nothing to embed and no gate
      # left to flip; the `#if !WATCH_EMBEDDED` fallback in SettingsView.swift is now permanently active.
      configs:
        # generate-project.sh drops FABOLUS_ICLOUD unless FABOLUS_ICLOUD=1 (default OFF → the no-op iCloud
        # stub compiles and the app signs on a free account).
        # generate-project.sh also drops FABOLUS_TEMPRATE_CIQ_EXPERIMENTAL unless
        # FABOLUS_TEMPRATE_CIQ_EXPERIMENTAL=1 (default OFF). Phase 09.5 D-02: current Tandem docs say a
        # temp rate can be set while Control-IQ+ is ON, but the repo's LOCKED constraint says the pump
        # rejects it — this flag EXPERIMENTALLY overturns the CIQ-off precondition in AppModel.setTempBasal
        # ONLY when explicitly opted in (local/bench builds), never in a build a real user or CI runs.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG GARMIN FABOLUS_NUDGE FABOLUS_ICLOUD FABOLUS_TEMPRATE_CIQ_EXPERIMENTAL FABOLUS_HEALTHKIT
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: GARMIN FABOLUS_NUDGE FABOLUS_ICLOUD FABOLUS_TEMPRATE_CIQ_EXPERIMENTAL FABOLUS_HEALTHKIT

  # Phase 3 (03-03, REMOTE-03/REMOTE-04): the watchOS companion app (incl. the direct-pump/
  # subtree) and its glucose-complication extension are removed from narrow main entirely
  # (delete-on-main, D-01) — no target-def bodies, no compile gate. Both trees are preserved on
  # dev/watch-remote (app + complication) and dev/watch-host (direct-pump subtree, REMOTE-04); see
  # their REINTEGRATION.md for how to restore the target defs + the
  # FABOLUS_WATCH/WATCH_EMBEDDED/FABOLUS_WATCH_DIRECT_PUMP cascade this used to drive.

  # WidgetKit extension — Lock Screen (accessory) + Home Screen widgets + tap-to-bolus. Reads
  # the snapshot the app publishes to the shared App Group; never touches Bluetooth itself.
  # 09.26-06 (D-08): this is the CONFIG TRUTH for the widget extension's min-OS floor — 18.0,
  # matching the host app (`faBolus` target above). GlucoseLiveActivity.swift's CarPlay `.small`
  # availability branches were reconciled to this floor (unconditional, no `@available(iOS 18, *)`
  # split, no bundle-level `if #available`) — see that file's doc comments.
  faBolusWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - ios/faBolusWidgets
      - path: Shared/WidgetShared.swift
      - path: Shared/LiveActivityShared.swift
      - path: Shared/LiveActivityIntents.swift
      - path: Shared/WidgetBolusIntents.swift
    dependencies:
      # D-01/D-02: this widget/Live Activity extension previously linked neither faBolus nor
      # faBolusCore. Adding faBolusDesign deliberately reverses that no-faBolusCore-in-extensions
      # policy — viable because faBolusCore has zero package dependencies of its own. faBolusCore is
      # declared DIRECTLY (not only transitively via faBolusDesign): these widget sources import it
      # and call GlucoseRange.classify/.symbolName, and an app-extension does not link a dependency's
      # transitive closure — those symbols must come from a direct product dep or Ld fails.
      - package: faBolusDesign
        product: faBolusDesign
      - package: faBolusCore
        product: faBolusCore
    info:
      path: ios/faBolusWidgets/Info.plist
      properties:
        AppGroupIdentifier: group.$(APP_BUNDLE_ID)
        CFBundleDisplayName: faBolus
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ios/faBolusWidgets/faBolusWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
        # F1 (§13): match the app's default at-rest protection so files the widget creates in the shared
        # App Group (e.g. a ledger write) get the same "AfterFirstUnlock" class. NEVER "…Complete" (the
        # widget reads the ledger while the phone is locked). Inert on the unsigned Simulator (CI) build.
        # >>> DATA_PROTECTION (stripped by scripts/generate-project.sh unless FABOLUS_DATA_PROTECTION=1)
        com.apple.developer.default-data-protection: NSFileProtectionCompleteUntilFirstUserAuthentication
        # <<< DATA_PROTECTION
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"

  # Behavioral e2e suite (audit C-08 / T-01). A hosted unit-test bundle that drives the real
  # AppModel remote-delivery decision logic — the divergence guard, freeze-before-approve
  # (C-02), the child/read-only action gates (A-05), and the idempotency-ledger wiring (A-02) —
  # against the in-memory MockBackend, so it runs on the Simulator with no pump/BLE hardware.
  # (TandemBackend-internal paths that need CoreBluetooth — pump-transaction drop/timeout A-03,
  # glucose single-flight C-05 — are still bench/BLE-mock scoped; see docs/UNVERIFIED-GUESSES.md.)
  faBolusAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - ios/faBolusAppTests
    dependencies:
      - target: faBolus
      - package: faBolusCore
        product: faBolusCore
      - package: faBolusDesign
        product: faBolusDesign
      # Phase 09.7-01: HistoryLogSyncTests injects an in-memory GlucoseHistoryStore directly (test
      # isolation from the app's real on-disk store) — needs a direct module import, not just the
      # transitive link the app target already has.
      - package: HistoryStore
        product: HistoryStore
      # Phase 09.17-01 (D-06b): compact-width visual-regression net. Test-target-ONLY dependency —
      # never linked into any shipping app/extension target, so it never ships in the
      # App Store binary (Pitfall 4).
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).appTests
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
        # This test target does NOT inherit the faBolus app target's SWIFT_ACTIVE_COMPILATION_CONDITIONS
        # (each target's compile conditions are independent in xcodegen) — so the D-02 experimental-only
        # regression test (AppModelBehaviorTests.swift, `#if FABOLUS_TEMPRATE_CIQ_EXPERIMENTAL`) needs its
        # own copy of the flag here to compile in under the same opt-in. Dropped by the same
        # generate-project.sh `drop_flag FABOLUS_TEMPRATE_CIQ_EXPERIMENTAL` default-OFF strip (scoped to
        # every SWIFT_ACTIVE_COMPILATION_CONDITIONS line in the spec, not just the app target's).
        # Phase 09.23 (D-13): same reasoning for FABOLUS_HEALTHKIT — HealthKitBuildGateGuardTests /
        # CgmConfigSectionCopyGuardTests's `#if FABOLUS_HEALTHKIT`-gated members need this target's own
        # copy of the flag to compile in under the same opt-in.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: FABOLUS_TEMPRATE_CIQ_EXPERIMENTAL FABOLUS_HEALTHKIT

schemes:
  # Phase 3 (03-03, REMOTE-03): the Watch-only CI scheme is retired along with the whole Watch
  # target — there is nothing left for it to build. Preserved on dev/watch-remote's REINTEGRATION.md.

  # Primary app scheme, shared so it survives project regeneration (otherwise it's only an
  # Xcode auto-created user scheme that gets wiped whenever generate-project.sh runs).
  faBolus:
    build:
      targets:
        faBolus: all
        # Compiled only for the test action (so build-sim.sh / the CI `build` step stay app-only).
        faBolusAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - faBolusAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
