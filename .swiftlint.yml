# SwiftLint is a gate: CI fails on any violation. It runs a short list of rules that catch real
# mistakes, not style. swift-format owns layout, so no rule here overlaps it, and no rule here may
# fight a wire contract (field names, opcode constants, settings keys, raw values).
#
# A suppression is written inline, names the rule and gives a reason:
#   // swiftlint:disable:next force_try - the fixture is a compile-time constant
#
# Run: swiftlint lint --strict --quiet

only_rules:
  # Correctness
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicate_imports
  - identical_operands
  - no_fallthrough_only
  - unused_optional_binding
  - unused_setter_value
  # Crashes that should be handled
  - force_cast
  - force_try
  - fatal_error_message
  # Concurrency and lifetime
  - class_delegate_protocol
  - weak_delegate
  - unowned_variable_capture
  - unhandled_throwing_task
  - discarded_notification_center_observer
  - notification_center_detachment
  # Overrides
  - overridden_super_call
  - prohibited_super_call
  # Legacy APIs with a safer replacement
  - compiler_protocol_init
  - legacy_random
  - dynamic_inline
  # Tests
  - private_unit_test
  - xctfail_message
  # Suppressions stay honest
  - blanket_disable_command
  - invalid_swiftlint_command
  - superfluous_disable_command

# Each new source root is added here as the rebuild creates it.
included:
  - Packages
  - ios

excluded:
  # Vendored from LoopKit; not restyled, so drift against upstream stays visible.
  - Packages/ShareClient
  - Packages/faBolusCore/.build
  - Packages/faBolusDesign/.build
  - Packages/HistoryStore/.build
  - Packages/ShareClient/.build
  - Packages/DexcomBLE/.build
  - Packages/GlucoseSources/.build
  - Packages/PumpSession/.build
  - Packages/Alerts/.build
  - Packages/RemoteProtocol/.build
  - Packages/WatchLink/.build
  - Packages/PhoneApp/.build
