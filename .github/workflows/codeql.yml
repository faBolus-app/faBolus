# CodeQL — semantic security analysis (taint, injection, unsafe API, cleartext handling).
#
# This is a SECURITY layer, not a style or slop gate. CodeQL does not find phase-ticket comments or
# vacuous tests; Semgrep and SwiftLint cover those in ci.yml.
#
# Triage rules for this repo:
#   - Do NOT "clean up" a fail-closed path, a clamp, a confirm gesture, or a frozen accessor because a
#     query dislikes it.
#   - Crypto- and randomness-family queries will fire on the Mac/peer pairing payload and the App
#     Group / Keychain plumbing. Review each alert, dismiss with a reason in the code-scanning UI.
#   - A cleartext-logging alert on glucose or insulin values is worth reading carefully: those are
#     health data, and the diagnostics bundle is user-shareable.
#
# Swift analysis requires macOS and a real compile — there is no Linux or Windows path. This repo is
# public, so GitHub code scanning is free; a private fork would need GitHub Advanced Security.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query reaches the default branch without waiting for a push.
    - cron: '41 6 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Swift
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      security-events: write
      packages: read
      contents: read

    steps:
      - name: Checkout faBolus
        uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app && xcodebuild -version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual
          # `security-and-quality` rather than the default `code-scanning` suite. Be aware what this
          # does and does not buy on Swift: Swift ships 27 security queries and ZERO
          # quality/maintainability queries, so this suite is identical to `security-extended` here
          # and adds exactly one query over the default (`UnsafeJsEval`, medium precision, which
          # needs a WKWebView this workspace does not have). It is set anyway because it costs
          # nothing and picks up Swift quality queries automatically if GitHub ever ships them.
          # The two `precision: low` credential queries no suite selects are added explicitly.
          queries: security-and-quality,./.github/codeql/swift-extra.qls

      # Manual build mode, over the same packages scripts/check.sh builds (until the app target
      # returns). --disable-sandbox: under CodeQL's tracer, SwiftPM's sandbox-exec fails to launch on
      # the Xcode 27 image ("Bad CPU type in executable").
      - name: Build the packages
        run: |
          for p in faBolusCore faBolusDesign HistoryStore ShareClient; do
            swift build --disable-sandbox --package-path "Packages/$p"
          done

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:swift
