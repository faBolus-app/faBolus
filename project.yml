    # <<< TANDEM_PINNED
  # >>> GARMIN (scripts/generate-project.sh strips this block when the SDK is absent)
  ConnectIQ:
    # Garmin Connect IQ Mobile SDK for iOS (binary xcframework). Not committed (Garmin
    # license). Place it where the docs describe. Path is relative to this repo.
    path: ../../vendor/connectiq-companion-app-sdk-ios-1.8.0
  # <<< GARMIN

targets:
  # iOS host app — owns the pump connection (TandemKit) and the main HUD.
  faBolus:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ios/faBolus
        # >>> APP_SOURCE_EXCLUDES (Phase-0 per-surface compile gates — D-03/TOPO-03. These sources live INSIDE
        #   the unconditional ios/faBolus include, so they are gated via this excludes: list rather than a
        #   whole-block strip. generate-project.sh removes this ENTIRE block when every gate below is at its
        #   default (=1, surface PRESENT) so the app target is byte-identical to today's shipped build; when any
        #   FABOLUS_* gate is set to 0 the block is KEPT and only the still-present (=1) surfaces' exclude lines
        #   are dropped, leaving the =0 surface excluded. Phase 0 AUTHORS these gates and flips NOTHING off — the
        #   removal flip is the owning per-surface phase's job (CGM → Phase 1).)
        excludes:
          # Phase 3 (03-02, REMOTE-02): the PHONE_PEER gate is retired — the iPhone-to-iPhone peer remote
          # is now physically git rm'd from main (delete-on-main, D-01), preserved on dev/phone-remote,
          # not a compile-gated exclude. PeerRemoteHost.swift/PhoneRemoteClientModel.swift/
          # RemoteControlView.swift/RemoteRootView.swift/RemoteSettingsView.swift no longer exist on
          # main at all.
          # Phase 7 (07-01, FEAT-07): the FoodFinder compile gate is retired — the barcode/OpenFoodFacts
          # + AI carb-estimate surface is now physically git rm'd from main (delete-on-main, D-01/D-03),
          # preserved on dev/food-finder, not a compile-gated exclude. Data/FoodFinder/Views/FoodFinder
          # no longer exist on main at all.
        # <<< APP_SOURCE_EXCLUDES
      # PhoneRemoteHost.swift (the shared Garmin/widget-adjacent WatchConnectivity receiver core,
      # REMOTE-02) is already covered by the unconditional `ios/faBolus` include above — the
      # PHONE_PEER_KEEP redundant-retention block (Phase 0) is retired now that PHONE_PEER itself is
      # retired (Phase 3, 03-02): there is no longer a strip that could ever drop this file.
      # WidgetBolusIntents belongs to the widget extensions only (the app uses WidgetBolusReceiver).
      - path: Shared
        excludes:
          - WidgetBolusIntents.swift
    dependencies:
      - package: faBolusCore
        product: faBolusCore
      - package: faBolusDesign
        product: faBolusDesign
      - package: HistoryStore
        product: HistoryStore
      - package: ShareClient
        product: ShareClient
      - package: TandemKit
        product: TandemMessages
      - package: TandemKit
        product: TandemAuth
      - package: TandemKit
        product: TandemBLE
      # >>> GARMIN (stripped by scripts/generate-project.sh when the SDK is absent)
      - package: ConnectIQ
        product: ConnectIQ
      # <<< GARMIN
      # Embeds the WidgetKit extension (Lock Screen + Home Screen widgets).
      - target: faBolusWidgets
      # Phase 3 (03-03, REMOTE-03): the watchOS companion app embed + its FABOLUS_WATCH/
      # WATCH_EMBEDDED gate are retired — the whole Watch app + complication tree is git rm'd
      # from main (delete-on-main, D-01), preserved on dev/watch-remote. Not a compile-gated
      # embed anymore; there is nothing to embed.
    entitlements:
      path: ios/faBolus/faBolus.entitlements
      properties:
        # Shared container the app writes and the widgets read.
        com.apple.security.application-groups:
          - group.$(APP_BUNDLE_ID)
          # To read xDrip4iOS via its "Share to Loop" App Group, build + sign xDrip under the SAME
          # Apple Developer Team ID and uncomment the group matching xDrip's share type (App Groups
          # are team-scoped). $(DEVELOPMENT_TEAM) is substituted with your signing team at build.
          # See docs/operate/cgm-failover.md.
          # - group.com.$(DEVELOPMENT_TEAM).loopkit.LoopGroup                 # xDrip share type: Loop
          # - group.org.nightscout.$(DEVELOPMENT_TEAM).trio.trio-app-group   # xDrip share type: Trio
        # F1 (§13): default at-rest data protection for files this app creates that can't take a per-file
        # class (App-Group UserDefaults telemetry/runtime plists, the SwiftData history store).
        # "AfterFirstUnlock" — encrypted at rest yet readable during a locked background relaunch, matching
        # the delivery ledger. NEVER "…Complete": that would lock the ledger/history when the device locks
        # and break crash-recovery/reconciliation of an in-flight delivery. This is also iOS's own default
        # class, and inert on the unsigned Simulator (CI) build. It DOES require the Data Protection
        # capability provisioned on the App ID to SIGN a device build, so scripts/generate-project.sh
        # strips the tagged line below by default (like HealthKit/iCloud) — set FABOLUS_DATA_PROTECTION=1
        # on a provisioned/paid account to keep it. Stripping is a no-op on-device (this is iOS's default).
        # >>> DATA_PROTECTION (stripped by scripts/generate-project.sh unless FABOLUS_DATA_PROTECTION=1)
        com.apple.developer.default-data-protection: NSFileProtectionCompleteUntilFirstUserAuthentication
        # <<< DATA_PROTECTION
        # >>> TIME_SENSITIVE (stripped by scripts/generate-project.sh unless FABOLUS_TIME_SENSITIVE=1)
        # CR-01 (Phase 08): Time-Sensitive Notifications so the never-suppressible safety trio (pump
        # disconnected / CGM data lost / unresolved bolus) breaks through Focus / Do Not Disturb via
        # UNNotificationInterruptionLevel.timeSensitive while the special-request Critical Alerts entitlement
        # (D-02, deliberately absent) is still pending — what NotificationPoster.post now sets and what
        # AlertRulesView's "time-sensitive delivery" copy promises. Like Data Protection it needs the
        # capability provisioned on the App ID to SIGN a device build, so it is stripped by default so an
        # unmodified clone signs on a free account; enable on a provisioned account with FABOLUS_TIME_SENSITIVE=1.
        com.apple.developer.usernotifications.time-sensitive: true
        # <<< TIME_SENSITIVE
        # HealthKit (Phase 09.23, D-10/D-13) was removed from `main` entirely in Phase 5 (HEALTH-01) —
        # the entitlement, both usage strings, the compile flag, and the whole source surface are
        # `git rm`'d/deleted, not merely stripped-by-default. See dev/healthkit's REINTEGRATION.md.
        # Automatic iCloud settings sync (the ubiquity-kvstore entitlement + its FABOLUS_ICLOUD compile
        # flag) is retired outright, the same posture as HealthKit above — `ICloudSettingsSync` never
        # existed anywhere in the tree, so the guarded call sites it would have backed could not compile
        # if the flag were ever set. File-based backup/restore needs no entitlement and is unaffected.
    info:
      path: ios/faBolus/Info.plist
      properties:
        # App Group id (group.$(APP_BUNDLE_ID)) exposed to code so the shared-container store derives
        # it at runtime instead of hardcoding — stays correct if a self-compiler overrides APP_BUNDLE_ID.
        AppGroupIdentifier: group.$(APP_BUNDLE_ID)
        # Garmin Connect builds its "select devices for <app>" screen from CFBundleDisplayName.
        CFBundleDisplayName: faBolus
        # The Connect IQ BETA app id the phone pairs with (dashed UUID). Self-compilers who build their
        # own private beta set GARMIN_BETA_APP_ID in LocalConfig.xcconfig (see faBolusGarmin/scripts/
        # beta-build.sh). Defaults to the shared beta id via Config.xcconfig.
        GarminBetaAppID: $(GARMIN_BETA_APP_ID)
        # How Siri should pronounce/recognize the app name in App Shortcut phrases ("… in <name>").
        CFBundleSpokenName: "Fabolus"
        NSBluetoothAlwaysUsageDescription: "faBolus connects to your pump over Bluetooth to read status and deliver boluses."
        # HealthKit's NSHealthShareUsageDescription/NSHealthUpdateUsageDescription usage strings were
        # deleted in Phase 5 (HEALTH-01) along with the entitlement and the whole HealthKit surface —
        # see dev/healthkit's REINTEGRATION.md.
        # Keep the pump BLE connection alive in the background (bluetooth-central) so it works when
        # locked/backgrounded.
        UIBackgroundModes: [bluetooth-central]
        UILaunchScreen: {}
        # Garmin Connect IQ companion messaging: our custom callback scheme + querying the
        # Garmin Connect Mobile app.
        LSApplicationQueriesSchemes: [gcm-ciq]
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID).ciq
            CFBundleURLSchemes: [fabolusciq]
          # Deep links from the widgets (fabolus://bolus, fabolus://open).
          - CFBundleURLName: $(APP_BUNDLE_ID).deeplink
            CFBundleURLSchemes: [fabolus]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Feature compile flags. Default enables Garmin (ConnectIQ);
      # scripts/generate-project.sh removes the GARMIN token (and the package above) when the Garmin
      # SDK is absent. WATCH_EMBEDDED is permanently retired (Phase 3, 03-03, REMOTE-03) — the whole
      # Watch app + complication tree is git rm'd from main, so there is nothing to embed and no gate
      # left to flip; the `#if !WATCH_EMBEDDED` fallback in SettingsView.swift is now permanently active.
      configs:
        # generate-project.sh drops FABOLUS_TEMPRATE_CIQ_EXPERIMENTAL unless
        # FABOLUS_TEMPRATE_CIQ_EXPERIMENTAL=1 (default OFF). Phase 09.5 D-02: current Tandem docs say a
        # temp rate can be set while Control-IQ+ is ON, but the repo's LOCKED constraint says the pump
        # rejects it — this flag EXPERIMENTALLY overturns the CIQ-off precondition in AppModel.setTempBasal
        # ONLY when explicitly opted in (local/bench builds), never in a build a real user or CI runs.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG GARMIN FABOLUS_TEMPRATE_CIQ_EXPERIMENTAL FABOLUS_TIME_SENSITIVE
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: GARMIN FABOLUS_TEMPRATE_CIQ_EXPERIMENTAL FABOLUS_TIME_SENSITIVE

  # Phase 3 (03-03, REMOTE-03/REMOTE-04): the watchOS companion app (incl. the direct-pump/
  # subtree) and its glucose-complication extension are removed from narrow main entirely
  # (delete-on-main, D-01) — no target-def bodies, no compile gate. Both trees are preserved on
  # dev/watch-remote (app + complication) and dev/watch-host (direct-pump subtree, REMOTE-04); see
  # their REINTEGRATION.md for how to restore the target defs + the
  # FABOLUS_WATCH/WATCH_EMBEDDED/FABOLUS_WATCH_DIRECT_PUMP cascade this used to drive.

  # WidgetKit extension — Lock Screen (accessory) + Home Screen widgets + tap-to-bolus. Reads
  # the snapshot the app publishes to the shared App Group; never touches Bluetooth itself.
  # 09.26-06 (D-08): this is the CONFIG TRUTH for the widget extension's min-OS floor — 18.0,
  # matching the host app (`faBolus` target above). Phase 7 (07-01, FEAT-01): the glucose Live
  # Activity (GlucoseLiveActivity.swift, FullBleedGlucosePlot.swift, Shared/LiveActivityShared.swift,
  # Shared/LiveActivityIntents.swift) is removed from narrow main entirely — preserved on
  # dev/live-activity.
  faBolusWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - ios/faBolusWidgets
      - path: Shared/WidgetShared.swift
      - path: Shared/WidgetBolusIntents.swift
    dependencies:
      # D-01/D-02: this widget extension previously linked neither faBolus nor faBolusCore. Adding
      # faBolusDesign deliberately reverses that no-faBolusCore-in-extensions policy — viable
      # because faBolusCore has zero package dependencies of its own. faBolusCore is
      # declared DIRECTLY (not only transitively via faBolusDesign): these widget sources import it
      # and call GlucoseRange.classify/.symbolName, and an app-extension does not link a dependency's
      # transitive closure — those symbols must come from a direct product dep or Ld fails.
      - package: faBolusDesign
        product: faBolusDesign
      - package: faBolusCore
        product: faBolusCore
    info:
      path: ios/faBolusWidgets/Info.plist
      properties:
        AppGroupIdentifier: group.$(APP_BUNDLE_ID)
        CFBundleDisplayName: faBolus
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ios/faBolusWidgets/faBolusWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
        # F1 (§13): match the app's default at-rest protection so files the widget creates in the shared
        # App Group (e.g. a ledger write) get the same "AfterFirstUnlock" class. NEVER "…Complete" (the
        # widget reads the ledger while the phone is locked). Inert on the unsigned Simulator (CI) build.
        # >>> DATA_PROTECTION (stripped by scripts/generate-project.sh unless FABOLUS_DATA_PROTECTION=1)
        com.apple.developer.default-data-protection: NSFileProtectionCompleteUntilFirstUserAuthentication
        # <<< DATA_PROTECTION
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"

  # Behavioral e2e suite (audit C-08 / T-01). A hosted unit-test bundle that drives the real
  # AppModel remote-delivery decision logic — the divergence guard, freeze-before-approve
  # (C-02), the child/read-only action gates (A-05), and the idempotency-ledger wiring (A-02) —
  # against the in-memory MockBackend, so it runs on the Simulator with no pump/BLE hardware.
  # (TandemBackend-internal paths that need CoreBluetooth — pump-transaction drop/timeout A-03,
  # glucose single-flight C-05 — are still bench/BLE-mock scoped; see docs/UNVERIFIED-GUESSES.md.)
  faBolusAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - ios/faBolusAppTests
    dependencies:
      - target: faBolus
      - package: faBolusCore
        product: faBolusCore
      - package: faBolusDesign
        product: faBolusDesign
      # Phase 09.7-01: HistoryLogSyncTests injects an in-memory GlucoseHistoryStore directly (test
      # isolation from the app's real on-disk store) — needs a direct module import, not just the
      # transitive link the app target already has.
      - package: HistoryStore
        product: HistoryStore
      # Phase 09.17-01 (D-06b): compact-width visual-regression net. Test-target-ONLY dependency —
      # never linked into any shipping app/extension target, so it never ships in the
      # App Store binary (Pitfall 4).
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).appTests
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
        # This test target does NOT inherit the faBolus app target's SWIFT_ACTIVE_COMPILATION_CONDITIONS
        # (each target's compile conditions are independent in xcodegen) — so the D-02 experimental-only
        # regression test (AppModelBehaviorTests.swift, `#if FABOLUS_TEMPRATE_CIQ_EXPERIMENTAL`) needs its
        # own copy of the flag here to compile in under the same opt-in. Dropped by the same
        # generate-project.sh `drop_flag FABOLUS_TEMPRATE_CIQ_EXPERIMENTAL` default-OFF strip (scoped to
        # every SWIFT_ACTIVE_COMPILATION_CONDITIONS line in the spec, not just the app target's).
        # FABOLUS_TIME_SENSITIVE mirrors the same pattern for NotificationCapabilityTests.swift's
        # `#if FABOLUS_TIME_SENSITIVE` branch, dropped by the same generate-project.sh
        # `drop_flag FABOLUS_TIME_SENSITIVE` default-OFF strip.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: FABOLUS_TEMPRATE_CIQ_EXPERIMENTAL FABOLUS_TIME_SENSITIVE

schemes:
  # Phase 3 (03-03, REMOTE-03): the Watch-only CI scheme is retired along with the whole Watch
  # target — there is nothing left for it to build. Preserved on dev/watch-remote's REINTEGRATION.md.

  # Primary app scheme, shared so it survives project regeneration (otherwise it's only an
  # Xcode auto-created user scheme that gets wiped whenever generate-project.sh runs).
  faBolus:
    build:
      targets:
        faBolus: all
        # Compiled only for the test action (so build-sim.sh / the CI `build` step stay app-only).
        faBolusAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - faBolusAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
